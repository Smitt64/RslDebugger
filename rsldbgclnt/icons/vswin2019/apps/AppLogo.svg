<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <clipPath id="clip">
      <rect x="5" y="5" width="54" height="54" rx="11" ry="11"/>
    </clipPath>
  </defs>

  <!-- Плоский значок со светлой окантовкой: читается и на тёмном заголовке,
       и на светлом фоне Проводника -->
  <rect x="3" y="3" width="58" height="58" rx="13" ry="13"
        fill="#0E6B65" stroke="#FFFFFF" stroke-width="4"/>

  <!-- Мотив старой иконки: параллельные линии, изгибающиеся в "S".
       Уменьшены и отцентрированы, чтобы не касаться окантовки -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round"
     stroke-width="6.5" transform="translate(12.16 12.16) scale(0.62)">
    <path d="M 66 4  C 34 4, 48 24, 32 24  C 16 24, 30 44, -2 44"/>
    <path d="M 66 14 C 34 14, 48 34, 32 34 C 16 34, 30 54, -2 54"/>
    <path d="M 66 24 C 34 24, 48 44, 32 44 C 16 44, 30 64, -2 64"/>
  </g>

  <!-- Оранжевый акцент: точка-брейкпоинт на середине "S" -->
  <circle cx="32" cy="33.2" r="5" fill="#FCB332" stroke="#FFFFFF" stroke-width="2.5"/>
</svg>
